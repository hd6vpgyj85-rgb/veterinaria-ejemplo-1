<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de asistencia — Yukly Pets</title>
<link rel="icon" type="image/png" href="assets/images/logo-duck.png">
<style>
  :root {
    --blue: #2B7FD4;
    --blue-dark: #1F63A8;
    --blue-light: #EAF3FC;
    --yellow: #FFD166;
    --white: #FFFFFF;
    --ink: #1D2B3A;
    --gray: #5A6B7B;
    --red: #E4572E;
    --green: #2E9E5B;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: var(--font);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(circle at 20% 15%, var(--blue-light), #fff 60%);
    color: var(--ink);
  }

  .card {
    background: var(--white);
    border-radius: 28px;
    padding: 44px 32px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 50px rgba(43, 127, 212, 0.18);
  }

  .icon-circle {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: var(--blue-light);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
  }

  .icon-circle.success {
    background: #E4F6EB;
  }

  .icon-circle.error {
    background: #FDE7E1;
  }

  .icon-circle svg {
    width: 40px;
    height: 40px;
  }

  h1 {
    font-size: 1.3rem;
    margin-bottom: 10px;
  }

  p.detail {
    color: var(--gray);
    font-size: 0.95rem;
    margin-bottom: 6px;
  }

  .time {
    font-weight: 700;
    color: var(--blue-dark);
    font-size: 1.1rem;
    margin-top: 10px;
  }

  .spinner {
    width: 34px;
    height: 34px;
    border: 4px solid var(--blue-light);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="spinner" id="spinner"></div>
  <h1 id="title">Registrando...</h1>
  <p class="detail" id="detail">Un momento, estamos confirmando tu registro.</p>
</div>

<script src="assets/js/config.js"></script>
<script>
  (function () {
    var config = window.YUKLY_CONFIG || {};
    var isConfigured =
      config.SUPABASE_URL &&
      config.SUPABASE_ANON_KEY &&
      config.SUPABASE_URL.indexOf("REEMPLAZAR") === -1;

    var params = new URLSearchParams(window.location.search);
    var token = params.get("token");
    var type = params.get("type");

    function render(state, title, detail, timeLabel) {
      document.getElementById("spinner").remove();
      var icon = document.createElement("div");
      icon.className = "icon-circle " + state;
      if (state === "success") {
        icon.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke="#2E9E5B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
      } else {
        icon.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke="#E4572E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>';
      }
      document.getElementById("card").prepend(icon);
      document.getElementById("title").textContent = title;
      document.getElementById("detail").textContent = detail;
      if (timeLabel) {
        var timeEl = document.createElement("div");
        timeEl.className = "time";
        timeEl.textContent = timeLabel;
        document.getElementById("card").appendChild(timeEl);
      }
    }

    if (!isConfigured) {
      render("error", "Configuración pendiente", "El sistema de registro todavía no está activado.");
      return;
    }

    if (!token || !type) {
      render("error", "Enlace inválido", "Este enlace de registro no tiene los datos necesarios.");
      return;
    }

    fetch(config.SUPABASE_URL + "/functions/v1/checkin", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + config.SUPABASE_ANON_KEY,
        apikey: config.SUPABASE_ANON_KEY,
      },
      body: JSON.stringify({ token: token, type: type }),
    })
      .then(async function (response) {
        var body = await response.json();
        if (!response.ok) {
          throw new Error(body.error || "No se pudo registrar la asistencia.");
        }
        var timeLabel = new Date(body.occurredAt).toLocaleString("es-MX", {
          hour: "2-digit",
          minute: "2-digit",
          day: "2-digit",
          month: "short",
        });
        var label = type === "entrada" ? "Entrada registrada" : "Salida registrada";
        render("success", label, "¡Hola, " + body.employeeName + "! Tu registro se guardó correctamente.", timeLabel);
      })
      .catch(function (error) {
        render("error", "No se pudo registrar", error.message || "Intenta de nuevo o avisa al dueño del negocio.");
      });
  })();
</script>
</body>
</html>
