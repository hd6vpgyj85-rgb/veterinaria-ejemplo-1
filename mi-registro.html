<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi registro — Yukly Pets</title>
<link rel="icon" type="image/png" href="assets/images/logo-duck.png">
<style>
  :root {
    --blue: #2B7FD4;
    --blue-dark: #1F63A8;
    --blue-light: #EAF3FC;
    --yellow: #FFD166;
    --white: #FFFFFF;
    --ink: #1D2B3A;
    --gray: #5A6B7B;
    --red: #E4572E;
    --green: #2E9E5B;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: var(--font);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(circle at 20% 15%, var(--blue-light), #fff 60%);
    color: var(--ink);
  }

  .card {
    background: var(--white);
    border-radius: 28px;
    padding: 44px 32px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 50px rgba(43, 127, 212, 0.18);
  }

  .logo {
    width: 56px;
    height: 56px;
    object-fit: contain;
    margin: 0 auto 16px;
    display: block;
  }

  h1 {
    font-size: 1.3rem;
    margin-bottom: 6px;
  }

  p.detail {
    color: var(--gray);
    font-size: 0.95rem;
    margin-bottom: 24px;
  }

  .checkin-btn {
    width: 100%;
    padding: 18px 20px;
    border: none;
    border-radius: 100px;
    background: var(--yellow);
    color: var(--ink);
    font-weight: 800;
    font-size: 1.05rem;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }

  .checkin-btn:hover {
    transform: translateY(-2px);
  }

  .checkin-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  .status-note {
    margin-top: 16px;
    font-size: 0.85rem;
    color: var(--gray);
  }

  .icon-circle {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
  }

  .icon-circle.success {
    background: #E4F6EB;
  }

  .icon-circle.error {
    background: #FDE7E1;
  }

  .icon-circle svg {
    width: 40px;
    height: 40px;
  }

  .time {
    font-weight: 700;
    color: var(--blue-dark);
    font-size: 1.1rem;
    margin-top: 10px;
  }

  .spinner {
    width: 30px;
    height: 30px;
    border: 4px solid var(--blue-light);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  .hidden {
    display: none !important;
  }
</style>
</head>
<body>

<div class="card" id="card">
  <img class="logo" src="assets/images/logo-duck.png" alt="Yukly Pets">
  <div id="content">
    <div class="spinner"></div>
    <p class="detail">Cargando tu información...</p>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script>
  (function () {
    var config = window.YUKLY_CONFIG || {};
    var isConfigured =
      config.SUPABASE_URL &&
      config.SUPABASE_ANON_KEY &&
      config.SUPABASE_URL.indexOf("REEMPLAZAR") === -1;

    var params = new URLSearchParams(window.location.search);
    var token = params.get("token");
    var content = document.getElementById("content");

    function callFunction(name, payload) {
      return fetch(config.SUPABASE_URL + "/functions/v1/" + name, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + config.SUPABASE_ANON_KEY,
          apikey: config.SUPABASE_ANON_KEY,
        },
        body: JSON.stringify(payload),
      }).then(async function (response) {
        var body = await response.json();
        if (!response.ok) {
          var error = new Error(body.error || "Ocurrió un error.");
          error.distanceMeters = body.distanceMeters;
          throw error;
        }
        return body;
      });
    }

    function renderMessage(state, title, detail, timeLabel) {
      var icon = state
        ? '<div class="icon-circle ' +
          state +
          '">' +
          (state === "success"
            ? '<svg viewBox="0 0 24 24" fill="none" stroke="#2E9E5B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
            : '<svg viewBox="0 0 24 24" fill="none" stroke="#E4572E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>') +
          "</div>"
        : "";
      content.innerHTML =
        icon +
        "<h1></h1><p class=\"detail\"></p>" +
        (timeLabel ? '<div class="time"></div>' : "");
      content.querySelector("h1").textContent = title;
      content.querySelector(".detail").textContent = detail;
      if (timeLabel) {
        content.querySelector(".time").textContent = timeLabel;
      }
    }

    function renderButton(employeeName, nextType) {
      var label = nextType === "entrada" ? "Marcar entrada" : "Marcar salida";
      content.innerHTML =
        '<h1></h1><p class="detail">Presiona el botón solo cuando estés físicamente en la clínica.</p>' +
        '<button class="checkin-btn" id="checkinBtn"></button>' +
        '<p class="status-note" id="statusNote"></p>';
      content.querySelector("h1").textContent = "Hola, " + employeeName;
      content.querySelector("#checkinBtn").textContent = label;

      document.getElementById("checkinBtn").addEventListener("click", function () {
        handleCheckin(nextType);
      });
    }

    function handleCheckin(nextType) {
      var btn = document.getElementById("checkinBtn");
      var statusNote = document.getElementById("statusNote");
      btn.disabled = true;
      statusNote.textContent = "Obteniendo tu ubicación...";

      if (!navigator.geolocation) {
        statusNote.textContent = "Tu navegador no permite compartir ubicación, no se puede registrar.";
        btn.disabled = false;
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function (position) {
          statusNote.textContent = "Registrando...";
          callFunction("worker-checkin", {
            token: token,
            lat: position.coords.latitude,
            lng: position.coords.longitude,
          })
            .then(function (body) {
              var timeLabel = new Date(body.occurredAt).toLocaleString("es-MX", {
                hour: "2-digit",
                minute: "2-digit",
                day: "2-digit",
                month: "short",
              });
              var title = body.type === "entrada" ? "Entrada registrada" : "Salida registrada";
              renderMessage("success", title, "¡Listo, " + body.employeeName + "! Tu registro se guardó correctamente.", timeLabel);
            })
            .catch(function (error) {
              var detail = error.message;
              if (typeof error.distanceMeters === "number") {
                detail += " Estás a " + error.distanceMeters + " m del negocio.";
              }
              renderMessage("error", "No se pudo registrar", detail);
            });
        },
        function () {
          statusNote.textContent = "No pudimos obtener tu ubicación. Activa el GPS y dale permiso a esta página, luego intenta de nuevo.";
          btn.disabled = false;
        },
        { enableHighAccuracy: true, timeout: 15000 },
      );
    }

    if (!isConfigured) {
      renderMessage(null, "Configuración pendiente", "El sistema de registro todavía no está activado.");
      return;
    }

    if (!token) {
      renderMessage("error", "Enlace inválido", "Este enlace de registro no tiene los datos necesarios.");
      return;
    }

    callFunction("worker-status", { token: token })
      .then(function (body) {
        renderButton(body.employeeName, body.nextType);
      })
      .catch(function (error) {
        renderMessage("error", "No se pudo cargar tu información", error.message);
      });
  })();
</script>
</body>
</html>
